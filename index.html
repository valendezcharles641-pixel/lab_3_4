<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Coffee Hub Dashboard</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="row min-vh-100 align-items-center justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">
        <div class="login-card p-4 p-md-5">
          <div class="text-center mb-4">
            <h1 class="h3" style="color: #2A1A0E;">☕ Coffee Hub</h1>
            <p class="text-muted">Inventory & Sales Management System</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>

            <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

            <button type="submit" class="btn btn-coffee w-100 py-2">Sign In</button>
          </form>

          <p class="text-center mt-3 small text-muted">
            Demo Credentials: <strong>admin</strong> / <strong>coffee123</strong>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Authentication Logic -->
  <script src="script.js"></script>
</body>
</html>
